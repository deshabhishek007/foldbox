<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Foldbox demo</title>
	<link rel="stylesheet" href="../src/foldbox.css">
	<style>
		:root { color-scheme: light; }
		body { margin: 0; padding: 32px 16px 64px; font: 16px/1.5 system-ui, sans-serif; color: #1e1e1e; background: #f6f6f4; }
		main { max-width: 1100px; margin: 0 auto; }
		h1 { margin: 0 0 4px; font-size: 2rem; }
		h2 { margin: 48px 0 12px; font-size: 1.25rem; }
		p.lead { margin: 0 0 24px; color: #555; }
		.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
		.filters button { padding: 6px 16px; font: inherit; background: none; border: 1px solid #1e1e1e; border-radius: 999px; cursor: pointer; }
		.filters button.is-active,
		.filters button[aria-pressed="true"] { color: #fff; background: #1e1e1e; }
		.filters .label { align-self: center; margin-right: 4px; color: #555; }
		.grid { display: flex; flex-wrap: wrap; margin: 0 -8px; }
		.grid > .card { width: 33.333%; padding: 0 8px 16px; }
		@media (max-width: 800px) { .grid > .card { width: 50%; } }
		@media (max-width: 500px) { .grid > .card { width: 100%; } }
		.card[hidden] { display: none; }
		.card button { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; font: inherit; }
		.card img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 8px; }
		.card span { display: block; margin-top: 6px; font-weight: 600; }
		.links { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
		.links img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
	</style>
</head>
<body>
<main>
	<h1>Foldbox</h1>
	<p class="lead">A lightbox and filterable grid for photos and videos. Click an album cover.</p>

	<div class="filters" id="themes" role="group" aria-label="Gallery theme">
		<span class="label">Gallery theme</span>
		<button type="button" aria-pressed="true" data-theme="dark">Dark</button>
		<button type="button" aria-pressed="false" data-theme="light">Light</button>
		<button type="button" aria-pressed="false" data-theme="auto">Auto</button>
	</div>

	<div class="filters" id="filters">
		<button type="button" class="is-active" data-filter="*">All</button>
		<button type="button" data-filter=".nature">Nature</button>
		<button type="button" data-filter=".city">City</button>
		<button type="button" data-filter=".video">Video</button>
	</div>
	<div class="grid" id="grid"></div>

	<h2>Plain links with <code>Foldbox.bind()</code></h2>
	<div class="links" id="links">
		<a href="https://picsum.photos/id/1015/1600/1067" data-caption="River valley"><img src="https://picsum.photos/id/1015/300/300" alt="River valley"></a>
		<a href="https://picsum.photos/id/1016/1600/1067" data-caption="Canyon"><img src="https://picsum.photos/id/1016/300/300" alt="Canyon"></a>
		<a href="https://picsum.photos/id/1018/1600/1067" data-caption="Mountains"><img src="https://picsum.photos/id/1018/300/300" alt="Mountains"></a>
		<a href="https://picsum.photos/id/1019/1600/1067" data-caption="Coast"><img src="https://picsum.photos/id/1019/300/300" alt="Coast"></a>
	</div>
</main>

<script src="../src/foldbox.js"></script>
<script>
	const photo = function ( id, title ) {
		return {
			src: 'https://picsum.photos/id/' + id + '/1600/1067',
			thumb: 'https://picsum.photos/id/' + id + '/200/200',
			alt: title,
			caption: '<h4>' + title + '</h4><p>Photo ' + id + '</p>',
		};
	};
	const albums = [
		{ title: 'Forest walk', cat: 'nature', cover: 1043, items: [ photo( 1043, 'Forest' ), photo( 1044, 'Lake' ), photo( 1047, 'Bridge' ), photo( 1050, 'Waves' ) ] },
		{ title: 'Downtown', cat: 'city', cover: 1067, items: [ photo( 1067, 'Skyline' ), photo( 1076, 'Street' ), photo( 1078, 'Market' ) ] },
		{ title: 'Mixed media', cat: 'video', cover: 1080, items: [
			photo( 1080, 'Strawberries' ),
			{ src: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4', thumb: 'https://picsum.photos/id/152/200/200', caption: '<h4>MP4 video</h4>' },
			{ src: 'https://www.youtube.com/watch?v=aqz-KE-bpKQ', caption: '<h4>YouTube</h4>' },
			{ src: 'https://vimeo.com/76979871', thumb: 'https://picsum.photos/id/180/200/200', caption: '<h4>Vimeo</h4>' },
		] },
		{ title: 'Mountains', cat: 'nature', cover: 1036, items: [ photo( 1036, 'Peak' ), photo( 1039, 'Falls' ) ] },
		{ title: 'Night city', cat: 'city', cover: 1033, items: [ photo( 1033, 'Lights' ), photo( 1031, 'Tower' ) ] },
		{ title: 'Single photo', cat: 'nature', cover: 1025, items: [ photo( 1025, 'Pug' ) ] },
	];

	let theme = 'dark';

	const grid = document.getElementById( 'grid' );
	albums.forEach( function ( album ) {
		const card = document.createElement( 'div' );
		card.className = 'card ' + album.cat;
		card.innerHTML = '<button type="button"><img src="https://picsum.photos/id/' + album.cover + '/600/400" alt=""><span></span></button>';
		card.querySelector( 'span' ).textContent = album.title + ' (' + album.items.length + ')';
		card.querySelector( 'button' ).addEventListener( 'click', function () {
			Foldbox.open( album.items, { origin: card.querySelector( 'img' ), download: true, theme: theme } );
		} );
		grid.appendChild( card );
	} );

	const filterGrid = Foldbox.grid( grid, { itemSelector: ':scope > .card' } );
	const buttons = document.querySelectorAll( '#filters button' );
	buttons.forEach( function ( btn ) {
		btn.addEventListener( 'click', function () {
			buttons.forEach( function ( b ) { b.classList.toggle( 'is-active', b === btn ); } );
			filterGrid.filter( btn.getAttribute( 'data-filter' ) );
		} );
	} );

	// bind() reads its options once, so rebind when the theme changes.
	let unbindLinks = Foldbox.bind( '#links', { animation: 'fade', theme: theme } );

	const themeButtons = document.querySelectorAll( '#themes button' );
	themeButtons.forEach( function ( btn ) {
		btn.addEventListener( 'click', function () {
			theme = btn.getAttribute( 'data-theme' );
			themeButtons.forEach( function ( b ) { b.setAttribute( 'aria-pressed', b === btn ? 'true' : 'false' ); } );
			unbindLinks();
			unbindLinks = Foldbox.bind( '#links', { animation: 'fade', theme: theme } );
		} );
	} );
</script>
</body>
</html>
